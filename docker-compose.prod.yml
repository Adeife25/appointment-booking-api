# Single-host production stack. The API and nginx proxy only: Postgres and Redis
# are managed services (Render/Railway/Fly) reached over TLS via DATABASE_URL and
# REDIS_URL in .env.production. Not needed when the platform supplies its own
# container runtime; it exists for the "Docker on one VPS" case.
#
#   cp .env.production.example .env.production && chmod 600 .env.production
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#   docker compose -f docker-compose.prod.yml exec api npm run prisma:deploy
services:
  api:
    image: ghcr.io/${GHCR_REPO}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "3001"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-3001}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"