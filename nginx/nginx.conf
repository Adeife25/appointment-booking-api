limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Docker's embedded DNS resolver. `proxy_pass` uses a variable so the `api`
# hostname is re-resolved every 10s, which lets nginx round-robin across all
# replicas when running `docker compose up --scale api=N`.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;

  access_log /dev/stdout;
  error_log  /dev/stderr;

  client_max_body_size 10m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  gzip_min_length 1024;

  location / {
    limit_req zone=api_limit burst=60 nodelay;

    set $api_upstream http://api:3001;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}